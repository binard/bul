<div class="carousel">
  <button
    type="button"
    class="carousel__arrow carousel__arrow--prev"
    (click)="scrollPrev()"
    aria-label="Photo précédente"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <ul
    #track
    class="carousel__track"
    role="region"
    aria-label="Galerie photos"
    aria-roledescription="carrousel"
    tabindex="0"
  >
    @for (item of items; track item.src; let i = $index) {
      <li
        class="carousel__slide"
        [style.aspect-ratio]="item.width + ' / ' + item.height"
        [attr.aria-roledescription]="'diapositive'"
        [attr.aria-label]="(i + 1) + ' sur ' + items.length"
      >
        <button
          type="button"
          class="carousel__btn"
          (click)="open(item)"
          [attr.aria-label]="'Agrandir : ' + item.alt"
        >
          <img
            [ngSrc]="item.src"
            [width]="item.width"
            [height]="item.height"
            [alt]="item.alt"
            loading="lazy"
          />
        </button>
      </li>
    }
  </ul>

  <button
    type="button"
    class="carousel__arrow carousel__arrow--next"
    (click)="scrollNext()"
    aria-label="Photo suivante"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>
</div>

@if (active(); as item) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photo agrandie"
    (click)="close()"
    (keydown)="onKeydown($event)"
    tabindex="-1"
  >
    <button
      type="button"
      class="lightbox__close"
      (click)="close()"
      aria-label="Fermer"
    >×</button>
    <img
      [src]="item.src"
      [alt]="item.alt"
      [width]="item.width"
      [height]="item.height"
    />
  </div>
}
